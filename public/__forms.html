<!doctype html>
<html lang="de">
  <head><meta charset="utf-8" /><meta name="robots" content="noindex" /><title>Formular-Erkennung</title></head>
  <body>
    <!-- Nur für die Formular-Erkennung von Netlify. Feldnamen müssen zu components/interessen-formular.tsx passen. -->
    <form name="interessenliste" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="interessenliste" />
      <input type="hidden" name="subject" value="Neuer Eintrag Interessenliste Refugium" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="telefon" />
      <input type="text" name="wohnort" />
      <select name="personen"><option>2</option></select>
      <select name="einheit"><option>Noch offen</option></select>
      <textarea name="nachricht"></textarea>
      <input type="checkbox" name="datenschutz" value="ja" />
    </form>
  </body>
</html>
